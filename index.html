<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Soccer Simulator 3000</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0b1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Soccer Sim">

<link rel="icon" href="./icon.svg" type="image/svg+xml">

<style>
  :root{
    --bg:#0b1220; --bg2:#0f1a2e; --card:#152238; --card2:#1b2c48;
    --line:#26385a; --txt:#e8eefc; --mut:#8fa3c8; --acc:#00e07a; --acc2:#12b76a;
    --warn:#ffb020; --bad:#ff5d5d; --gold:#ffd257; --chip:#22345a; --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(1200px 700px at 50% -10%, #16233d 0%, var(--bg) 55%) fixed;
    color:var(--txt); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh; line-height:1.45;
  }
  .wrap{max-width:760px; margin:0 auto; padding:20px 16px 60px}
  header.top{display:flex; align-items:center; gap:12px; margin-bottom:18px}
  header.top .logo{font-size:26px}
  header.top h1{font-size:19px; margin:0; letter-spacing:.3px; font-weight:800}
  header.top .sub{color:var(--mut); font-size:12px; margin-top:1px}
  .card{background:linear-gradient(180deg,var(--card) 0%,var(--bg2) 120%); border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin-bottom:16px; box-shadow:0 8px 30px rgba(0,0,0,.25)}
  .card h2{margin:0 0 6px; font-size:16px; position:relative; padding-left:12px}
  .card h2::before{content:""; position:absolute; left:0; top:3px; bottom:3px; width:4px; border-radius:3px; background:linear-gradient(var(--acc),var(--acc2))}
  .card .hint{color:var(--mut); font-size:13px; margin:0 0 14px}
  label{display:block; font-size:12px; color:var(--mut); margin:14px 0 6px; text-transform:uppercase; letter-spacing:.5px}
  input[type=text], select{
    width:100%; background:#0c1526; border:1px solid var(--line); color:var(--txt);
    padding:11px 12px; border-radius:11px; font-size:15px; outline:none;
  }
  input[type=text]:focus, select:focus{border-color:var(--acc)}
  .row{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .opts{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px}
  .opt{flex:1 1 auto; min-width:calc(50% - 8px); text-align:center; padding:10px 8px; background:#0c1526; border:1px solid var(--line); border-radius:11px; cursor:pointer; font-size:14px; user-select:none; transition:.12s}
  .opt small{display:block; color:var(--mut); font-size:11px; margin-top:2px}
  .opt:hover{border-color:#3a5488}
  .opt.sel{border-color:var(--acc); background:rgba(0,224,122,.10); box-shadow:0 0 0 1px var(--acc) inset}
  /* Positionsraster */
  .posgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin-top:6px}
  .poschip{text-align:center; padding:8px 4px; background:#0c1526; border:1px solid var(--line); border-radius:10px; cursor:pointer; user-select:none; transition:.12s}
  .poschip b{font-size:14px; letter-spacing:.5px}
  .poschip small{display:block; color:var(--mut); font-size:10px; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .poschip:hover{border-color:#3a5488}
  .poschip.sel{border-color:var(--acc); background:rgba(0,224,122,.10); box-shadow:0 0 0 1px var(--acc) inset}
  .arealbl{font-size:10px; color:var(--mut); letter-spacing:1px; text-transform:uppercase; margin:12px 0 2px}
  /* Avatar-Customizer */
  .avwrap{display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap; margin-top:6px}
  .avprev{width:104px; height:104px; flex:none; border-radius:50%; overflow:hidden; box-shadow:0 6px 18px rgba(0,0,0,.35)}
  .dbav{display:inline-block; border-radius:50%; overflow:hidden}
  .dbav svg{width:100%; height:100%; display:block}
  .avctrl{flex:1; min-width:240px}
  .avrow{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:8px 0}
  .avrow .cap{font-size:11px; color:var(--mut); width:74px; text-transform:uppercase; letter-spacing:.5px}
  .sw{width:26px; height:26px; border-radius:50%; cursor:pointer; border:2px solid #0c1526; box-shadow:0 0 0 1px var(--line)}
  .sw.sel{box-shadow:0 0 0 2px var(--acc)}
  .hchip{padding:6px 11px; background:#0c1526; border:1px solid var(--line); border-radius:9px; cursor:pointer; font-size:13px}
  .hchip.sel{border-color:var(--acc); box-shadow:0 0 0 1px var(--acc) inset}
  button.primary{width:100%; margin-top:20px; padding:14px; font-size:16px; font-weight:800; color:#04240f; background:linear-gradient(180deg,var(--acc),var(--acc2)); border:none; border-radius:13px; cursor:pointer; letter-spacing:.3px}
  button.ghost{width:100%; margin-top:10px; padding:12px; font-size:14px; font-weight:700; color:var(--txt); background:transparent; border:1px solid var(--line); border-radius:12px; cursor:pointer}
  button.ghost:hover{border-color:#3a5488}
  .playerbar{display:flex; align-items:center; gap:14px; margin-bottom:16px; background:linear-gradient(180deg,var(--card2),var(--card)); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px}
  .playerbar .face{width:48px; height:48px; border-radius:50%; overflow:hidden; flex:none}
  .playerbar .meta{flex:1; min-width:0}
  .playerbar .nm{font-weight:800; font-size:17px}
  .playerbar .dt{color:var(--mut); font-size:12.5px; margin-top:1px}
  .ovrbadge{text-align:center; padding:4px 2px}
  .ovrbadge .n{font-size:26px; font-weight:900; line-height:1; color:var(--acc)}
  .ovrbadge .l{font-size:10px; color:var(--mut); letter-spacing:1px}
  .kv{display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px dashed var(--line); font-size:14px}
  .kv:last-child{border-bottom:none}
  .kv .k{color:var(--mut)}
  .kv .v{font-weight:700}
  .rolebox{display:flex; align-items:center; gap:10px; padding:12px; border-radius:12px; background:#0c1526; border:1px solid var(--line); margin-top:6px}
  .rolebox .dot{width:10px;height:10px;border-radius:50%}
  .rolebox b{font-size:15px}
  .rolebox small{color:var(--mut); display:block}
  .statgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:6px 0 4px}
  .stat{background:linear-gradient(180deg,#14213a,#0b1424); border:1px solid var(--line); border-radius:12px; padding:12px 8px; text-align:center}
  .stat .n{font-size:22px; font-weight:900}
  .stat .l{font-size:11px; color:var(--mut); margin-top:2px; text-transform:uppercase; letter-spacing:.5px}
  .note{background:rgba(255,176,32,.08); border:1px solid rgba(255,176,32,.35); color:#ffe0a3; padding:11px 13px; border-radius:12px; font-size:13.5px; margin:10px 0}
  .note.good{background:rgba(0,224,122,.08); border-color:rgba(0,224,122,.4); color:#b6ffd9}
  .note.bad{background:rgba(255,93,93,.08); border-color:rgba(255,93,93,.4); color:#ffc4c4}
  .offer{display:flex; align-items:center; gap:12px; padding:12px; border:1px solid var(--line); border-radius:12px; margin-top:10px; background:#0c1526}
  .offer .info{flex:1; min-width:0}
  .offer .info b{font-size:15px}
  .offer .info small{color:var(--mut); display:block}
  .offer button{padding:9px 14px; border-radius:10px; border:none; font-weight:800; cursor:pointer; background:var(--acc); color:#04240f; flex:none}
  .lvlpill{font-size:11px; font-weight:800; padding:2px 8px; border-radius:20px; background:var(--chip); color:#cde0ff}
  table.career{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:8px}
  table.career th,table.career td{padding:7px 6px; text-align:center; border-bottom:1px solid var(--line)}
  table.career th{color:var(--mut); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.3px}
  table.career td:nth-child(2){text-align:left}
  .verdict{text-align:center; padding:8px 0 4px}
  .verdict .big{font-size:22px; font-weight:900; color:var(--gold)}
  .verdict .sm{color:var(--mut); font-size:13px}
  .trophies{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
  .trophy{font-size:12px; padding:5px 10px; border-radius:20px; background:rgba(255,210,87,.12); border:1px solid rgba(255,210,87,.4); color:#ffe6a8}
  .tag{display:inline-block; font-size:11px; padding:2px 8px; border-radius:20px; background:var(--chip); color:#cde0ff; margin-left:6px; vertical-align:middle}
  .pbpill{font-size:11px; font-weight:700; background:#0c1526; border:1px solid var(--line); padding:2px 8px; border-radius:20px; white-space:nowrap}
  .halfopen{font-size:11.5px; color:var(--mut); margin-top:2px; text-align:center}
  .foot{text-align:center; color:var(--mut); font-size:11px; margin-top:20px}
  @media(max-width:480px){ .opt{min-width:100%} .posgrid{grid-template-columns:repeat(3,1fr)} }
</style>
</head>

const R=Math.random;
const rint=(a,b)=>Math.floor(R()*(b-a+1))+a;
const pick=a=>a[Math.floor(R()*a.length)];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const logistic=x=>1/(1+Math.exp(-x));
function poisson(lam){
  if(lam<=0) return 0;
  if(lam>30) return Math.max(0,Math.round(lam+Math.sqrt(lam)*gauss()));
  let L=Math.exp(-lam),k=0,p=1; do{k++;p*=R();}while(p>L); return k-1;
}
function gauss(){let u=0,v=0;while(u===0)u=R();while(v===0)v=R();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function shade(hex,amt){
  let c=hex.replace('#','');
  let r=clamp(parseInt(c.slice(0,2),16)+amt,0,255),g=clamp(parseInt(c.slice(2,4),16)+amt,0,255),b=clamp(parseInt(c.slice(4,6),16)+amt,0,255);
  return '#'+[r,g,b].map(x=>Math.round(x).toString(16).padStart(2,'0')).join('');
}
const tierOf=l=>l>=83?1:l>=76?2:l>=68?3:4;
// Gehalt (Mio./Jahr) je nach OVR (Starpower) & Klub-Level
function baseWage(clubLevel, ovr){ return Math.max(0.1, Math.round(0.15*Math.pow(1.10,ovr-60)*(0.6+clubLevel/150)*10)/10); }

// Rang einer Liga in ihrer Pyramide (0 = oberste); -1 = keine Pyramide
function pyramidRank(lg){ for(const c in PYRAMID){ const idx=PYRAMID[c].indexOf(lg); if(idx>=0) return idx; } return -1; }

// Passendes Länderturnier je nach Konföderation (Brasilien spielt keine EM!)
function tournamentFor(nat,year){
  const m=year%4;
  if(m===2) return "Weltmeisterschaft";
  if(m===1) return "WM-Qualifikation";
  switch(nat.conf){
    case "UEFA":     return m===0?"Europameisterschaft":"Nations League";
    case "CONMEBOL": return "Copa América";
    case "CAF":      return "Afrika-Cup";
    case "AFC":      return "Asien-Cup";
    case "CONCACAF": return "Gold Cup";
    default:         return "Länderspiele";
  }
}

// Europapokal je nach Klub-Stärke (Qualifikation über Level als Proxy)
function euroCompetition(club){
  const l=club.l;
  if(l>=81) return {name:"Champions League", winCh:clamp((l-82)/55,0.03,0.30), idx:(l-79)/2.4};
  if(l>=75) return {name:"Europa League",   winCh:clamp((l-76)/26,0.05,0.34), idx:(l-73)/2.2};
  if(l>=69) return {name:"Conference League",winCh:clamp((l-70)/18,0.06,0.42), idx:(l-67)/2.0};
  return null;
}

function transferFee(star,age){ let f=Math.pow(1.28, Math.max(0,star-80))*6; if(age>30) f*=0.35; else if(age>27) f*=0.6; else if(age>24) f*=0.9; else f*=1.2; return Math.round(f); }
// Topstars wechseln parallel die Klubs; liefert die 3 teuersten Transfers
function simTransfers(rivals){
  const topClubs=CLUBS.filter(c=>c.l>=80).map(c=>c.n), moves=[], used=new Set(), n=Math.min(rivals.length, rint(3,6));
  for(let k=0;k<n;k++){
    let i,tr=0; do{ i=rint(0,rivals.length-1); tr++; }while(used.has(i)&&tr<8); if(used.has(i))continue; used.add(i);
    const rv=rivals[i], from=rv.club; let to=pick(topClubs),t2=0; while(to===from&&t2<6){to=pick(topClubs);t2++;} if(to===from)continue;
    moves.push({name:rv.name,from,to,fee:transferFee(rv.star,rv.age)}); rv.club=to;
  }
  return moves.sort((a,b)=>b.fee-a.fee).slice(0,3);
}
function initWorld(){

}
// Simuliert eine komplette Saison in ALLEN Ligen; wendet Auf-/Abstieg an.
function advanceWorld(world, playerClubName, playerBoost){
  const byLeague={};
  for(const name in world.clubs){ const c=world.clubs[name]; (byLeague[c.league]=byLeague[c.league]||[]).push(c); }
  const tables={};
  for(const lg in byLeague){
    tables[lg]=byLeague[lg].map(c=>{
      let s=c.level+gauss()*3.2+(c.name===playerClubName?(playerBoost||0):0);
      return {name:c.name,level:Math.round(c.level),score:s};
    }).sort((a,b)=>b.score-a.score).map((r,i)=>({name:r.name,level:r.level,pos:i+1}));
  }
  const events=[], playoffs=[];
  const moveUp=(name,toLg)=>{ const c=world.clubs[name]; c.league=toLg; c.base=clamp(c.base+1.5,c.orig-5,c.orig+8); c.level=clamp(c.level+2,40,92); events.push({type:"up",name,league:toLg}); };
  const moveDown=(name,toLg)=>{ const c=world.clubs[name]; c.league=toLg; c.base=clamp(c.base-1.5,c.orig-8,c.orig+5); c.level=clamp(c.level-2,40,92); events.push({type:"down",name,league:toLg}); };
  for(const country in PYRAMID){
    const tiers=PYRAMID[country];
    for(let ti=0; ti<tiers.length-1; ti++){
      const top=tiers[ti], second=tiers[ti+1];
      const tt=tables[top], ts=tables[second];
      if(!tt||!ts||tt.length<3||ts.length<2) continue;
      const k=(tt.length>=8 && ts.length>=5)?2:1;   // große Ligen: 2 rauf/runter
      for(let j=0;j<k;j++){ moveDown(tt[tt.length-1-j].name, second); moveUp(ts[j].name, top); }
      // Relegations-Playoff: knapp-über-Abstieg vs knapp-unter-Aufstieg
      if(k===2 && tt.length>=6 && ts.length>=4){
        const topPO=tt[tt.length-1-k].name, secPO=ts[k].name;
        const topWinP=clamp(0.5+(world.clubs[topPO].level-world.clubs[secPO].level)*0.04,0.2,0.82);
        const topStays=R()<topWinP;
        if(!topStays){ moveDown(topPO, second); moveUp(secPO, top); }
        playoffs.push({top, second, topClub:topPO, secClub:secPO, topStays});
      }
    }
  }
  for(const name in world.clubs){ const c=world.clubs[name]; c.level=clamp(c.level+(c.base-c.level)*0.2+gauss()*0.5,40,93); }
  return {tables,events,playoffs};
}
// Ligaphasen-Tabellen der Europapokale (CL/EL/CoL)
function europeanTables(world, boostName, boostAmt){
  const clubs=Object.values(world.clubs);
  const bands={ "Champions League":[81,200], "Europa League":[75,81], "Conference League":[69,75] };
  const out={};
  for(const comp in bands){
    const lo=bands[comp][0], hi=bands[comp][1];
    const pool=clubs.filter(c=>c.level>=lo && c.level<hi).sort((a,b)=>b.level-a.level).slice(0,18);
    out[comp]=pool.map(c=>({name:c.name,level:Math.round(c.level),score:c.level+gauss()*3.0+(c.name===boostName?(boostAmt||0):0)}))
      .sort((a,b)=>b.score-a.score).map((r,i)=>({name:r.name,level:r.level,pos:i+1}));
  }
  return out;
}

function sameCountryLeagues(lg){ for(const c in PYRAMID){ if(PYRAMID[c].includes(lg)) return PYRAMID[c]; } return [lg]; }
function pickOpponentClub(myName,minLevel,leagues){
  const inLg=c=>!leagues||leagues.includes(c.league);
  let pool=Object.values(P.world.clubs).filter(c=>c.name!==myName && c.level>=minLevel && inLg(c));
  if(!pool.length) pool=Object.values(P.world.clubs).filter(c=>c.name!==myName && inLg(c));
  if(!pool.length) pool=Object.values(P.world.clubs).filter(c=>c.name!==myName);
  return pick(pool).name;
}
function pickOpponentNation(myNat, conf){
  const base=NATIONS.filter(n=>n.name!==myNat && (!conf||n.conf===conf));
  const pool=base.length?base:NATIONS.filter(n=>n.name!==myNat);
  const strong=pool.filter(n=>n.thr>=80);
  return pick(strong.concat(pool)).name;
}
function loseScore(){ const a=rint(0,2); return a+":"+(a+rint(1,2)); }
function winScore(){ const a=rint(1,3); return a+":"+rint(0,a-1); }
function compResult(rounds,won,idx,kind,myName,league){
  const cupLgs = kind==="cup"?sameCountryLeagues(league):null;
  const opp = won
    ? (kind==="nt"?pickOpponentNation(myName):pickOpponentClub(myName, kind==="cup"?60:79, cupLgs))
    : (kind==="nt"?pickOpponentNation(myName):pickOpponentClub(myName, kind==="cup"?55:74+idx*2, cupLgs));
  if(won) return `${rounds[rounds.length-1]} · Finale ${winScore()} gegen ${opp}`;
  if(idx<=0) return rounds[0];
  return `${rounds[idx]} – ${loseScore()} gegen ${opp}`;
}

// Baut Gruppe + K.o.-Pfad für ein Länderturnier
function buildBracket(nat, tour, exitIdx, won, rounds){
  const worldwide = tour==="Weltmeisterschaft";
  const confPool=NATIONS.filter(n=>n.name!==nat.name && (worldwide||n.conf===nat.conf));
  const pool=confPool.length>=3?confPool:NATIONS.filter(n=>n.name!==nat.name);
  const opps=[]; const used=new Set([nat.name]);
  while(opps.length<3){ const c=pick(pool); if(!used.has(c.name)){ used.add(c.name); opps.push(c); } }
  const advanced = exitIdx>=1 || won;
  const teams=[{name:nat.name,isMe:true,pts: advanced?(6+rint(1,3)):rint(1,4)}]
    .concat(opps.map(o=>({name:o.name,isMe:false,pts:rint(2,7)})));
  teams.sort((a,b)=>b.pts-a.pts);
  const ko=[];
  if(advanced){
    const maxI = won?rounds.length-1:exitIdx;
    for(let i=1;i<=maxI;i++){
      const rn=rounds[i]; if(!rn || rn.indexOf("Sieger")>=0) break;
      const isExit=!won && i===exitIdx; const w=!isExit;
      ko.push({round:rn, opp:pickOpponentNation(nat.name, worldwide?null:nat.conf), score:w?winScore():loseScore(), won:w});
    }
  }
  return {tour, nat:nat.name, teams, advanced, ko, won, exitLabel: won?"Sieger 🏆":rounds[exitIdx]};
}

// Stern-Spieler einer Nation (aus dem Rivalen-Pool) – so tauchen Newgens in „ihren" Nationalteams auf
function starOf(natName){ const rv=(P.world.rivals||[]).filter(r=>r.nat===natName).sort((a,b)=>b.star-a.star)[0]; return rv?rv.name:null; }
// 16 Teilnehmer: Konföderation zuerst, dann Gaststarter – jede Nation nur einmal
function tournamentTeams(nat, tour, n){
  const worldwide = tour==="Weltmeisterschaft";
  let pool=NATIONS.filter(x=>x.name!==nat.name && (worldwide||x.conf===nat.conf));
  if(pool.length<n-1) pool=pool.concat(NATIONS.filter(x=>x.name!==nat.name && x.conf!==nat.conf));
  const seen=new Set(); pool=pool.filter(x=>!seen.has(x.name)&&seen.add(x.name));
  pool.sort((a,b)=>b.thr-a.thr);
  const cand=pool.slice(0, Math.min(pool.length, (n-1)+8)), chosen=[];
  while(chosen.length<n-1 && cand.length){ chosen.push(cand.splice(Math.floor(R()*cand.length),1)[0]); }
  const rest=chosen.map(c=>({name:c.name,thr:c.thr}));
  for(let i=rest.length-1;i>0;i--){ const j=Math.floor(R()*(i+1)); const t=rest[i];rest[i]=rest[j];rest[j]=t; }
  return [{name:nat.name,thr:nat.thr}].concat(rest);
}

// Voller 16er-K.o.-Baum, alle Paarungen; Spieler-Pfad erzwungen bis zur Ausscheide-Runde
function buildKnockout16(nat, tour, exitIdx, won){
  const roundNames=["Achtelfinale","Viertelfinale","Halbfinale","Finale"];
  let slots=tournamentTeams(nat, tour, 16);
  const rounds=[];
  for(let r=0;r<4 && slots.length>1;r++){
    const matches=[], next=[];
    for(let i=0;i<slots.length;i+=2){
      const A=slots[i], B=slots[i+1], aMe=A.name===nat.name, bMe=B.name===nat.name;
      let winA;
      if(aMe||bMe){ const adv = won ? true : (r<exitIdx); winA = aMe?adv:!adv; }
      else winA = R()<clamp(0.5+(A.thr-B.thr)*0.03,0.12,0.88);
      const sc=koScore(winA);
      matches.push({a:A.name,b:B.name,sa:sc[0],sb:sc[1],w:(winA?A:B).name,aMe,bMe});
      next.push(winA?A:B);
    }
    rounds.push({name:roundNames[r],matches});
    slots=next;
  }
  return {tour, nat:nat.name, rounds, champion:slots[0]?slots[0].name:null, won};
}

    startOVR=clamp(Math.round(70+(age-19)*1.3+rint(-1,3)),66,80);

  const jn=(draft.jerseyName||"").trim()||((name.trim().split(/\s+/).pop()||"Profi").toUpperCase());

    ovr:startOVR, potential, club:{n:startClub.n,lg:startClub.lg,l:startClub.l}, role,

/* ============================ SEASON SIM ============================ */
function predictRole(share){
  if(share>=0.72) return {label:"Stammspieler",color:"var(--acc)",sub:"du spielst fast immer"};
  if(share>=0.45) return {label:"Rotationsspieler",color:"var(--warn)",sub:"du kämpfst um Einsätze"};
  if(share>=0.20) return {label:"Ergänzungsspieler",color:"#ff9a5a",sub:"eher von der Bank"};
  return {label:"Reservist / Bank",color:"var(--bad)",sub:"kaum Spielzeit – gefährlich für deine Entwicklung"};
}
function baseShare(){
  const gap=P.ovr-P.club.l;
  let s=logistic(gap/5.5);
  if(P.role==="star") s=Math.max(s,0.74);
  if(P.role==="prospect") s=Math.min(s,0.55);
  return clamp(s,0.02,0.98);
}

function simulateSeason(training){
  const meta=posOf(P.pos), fam=meta.fam, rates=POS_RATES[P.pos], st=P.style, club=P.club;
  const _wc=P.world&&P.world.clubs[P.club.n]; if(_wc){ P.club.l=Math.round(_wc.level); P.club.lg=_wc.league; }
  let share=baseShare();

  let injuryRisk=(0.07+Math.max(0,P.age-28)*0.022+training.risk)*DIFF().injury;
  let injured=false, injTxt=null;
  if(R()<clamp(injuryRisk,0.03,0.55)){
    injured=true; const sev=R();
    const f = sev<0.18?0.25 : sev<0.5?0.55 : 0.78; share*=f;
    injTxt = sev<0.18?"Schwere Verletzung – fast die ganze Saison raus." :
             sev<0.5?"Längere Verletzung – viele Spiele verpasst." :
             "Kleinere Verletzung – ein paar Wochen out.";
  }
  share=clamp(share,0.01,0.98);
  // Negative Saison-Ereignisse (Streit, Formkrise, Disziplin)
  let seasonEvent=null;
  if(!injured && R()<0.14*DIFF().event){
    seasonEvent=pick([
      {t:"Streit mit einem Mitspieler",pen:0.86,mor:-11},
      {t:"Zoff mit dem Trainer",pen:0.82,mor:-13},
      {t:"Formkrise – der Knoten platzt nicht",pen:0.75,mor:-7},
      {t:"Disziplinlosigkeit – zu spät zum Training",pen:0.9,mor:-9},
      {t:"Schwierige private Phase",pen:0.85,mor:-8}
    ]);
    share=clamp(share*seasonEvent.pen,0.01,0.98);
  }

  const cupGames = tierOf(club.l)<=2?8:4;
  const games=34+cupGames;
  const apps=Math.round(share*games);
  const minutes=Math.round(share*games*82);
  let posGames;
  if(P.pos2 && P.pos2!==P.pos && apps>0){ const sec=Math.round(apps*(0.15+R()*0.22)); posGames=[{pos:P.pos,games:apps-sec},{pos:P.pos2,games:sec}]; }
  else posGames=[{pos:P.pos,games:apps}];

  const teamF=clamp(1+(club.l-72)*0.013,0.7,1.55);
  const ovrF=clamp(1+(P.ovr-72)*0.010,0.75,1.4);
  const mor=(P.morale!=null?P.morale:65);
  const moraleF=1+(mor-65)/280;

  let goals=0,assists=0,cs=0,conceded=0,saves=0;
  if(fam!=="gk"){
    const expG=rates.g*(minutes/90)*teamF*ovrF*st.g*training.rate*moraleF;
    const expA=rates.a*(minutes/90)*teamF*ovrF*st.a*moraleF;
    goals=poisson(expG); assists=poisson(expA);
  }
  if(fam==="gk"||fam==="def"){
    const expConc=clamp(1.45-(club.l-72)*0.032-(P.ovr-72)*(fam==="gk"?0.022:0.010)*st.cs,0.22,2.6);
    for(let i=0;i<apps;i++){ const c=poisson(expConc); conceded+=c; if(c===0) cs++; if(fam==="gk"){ const shots=c+poisson(2.7); saves+=Math.max(0,shots-c); } }
  }

  let perf;
  if(fam==="score"||fam==="create"){
    const scorer = fam==="score" ? goals+0.6*assists : assists+0.7*goals;
    const exp=Math.max(1,(rates.g*st.g+rates.a*st.a)*(minutes/90)*teamF*ovrF);
    const overP=(goals+assists-exp)/exp;
    perf=clamp(5.0+overP*1.8+scorer*0.11,1,10);
  } else if(fam==="def"){
    const csRate=apps>0?cs/apps:0;
    perf=clamp(4.0+csRate*6.0+(goals+assists)*0.2,1,10);
  } else {
    const csRate=apps>0?cs/apps:0;
    const savePct=(saves+conceded)>0?saves/(saves+conceded):0;
    perf=clamp(3.2+csRate*4.0+savePct*3.0,1,10);
  }
  if(apps<6) perf=Math.min(perf,4.5);
  perf=clamp(perf + (mor-65)/45, 1, 10);

  let base; const a=P.age;
  if(a<=21) base=3.4; else if(a<=24) base=2.3; else if(a<=27) base=1.3;
  else if(a<=29) base=0.5; else if(a<=31) base=-0.4; else if(a<=33) base=-1.3; else base=-2.3;
  const minF=Math.sqrt(share);
  const perfF=0.55+perf/12;
  const room=clamp((P.potential-P.ovr)/7,0.2,1.4);
  let dOVR = base>0 ? base*minF*perfF*room*training.grow*DIFF().growth : base+(perf>7?0.4:0);
  let newOVR=clamp(Math.round((P.ovr+dOVR)*10)/10,45,99);

  const titlesWon=[];
  // ===== LIGA & LEBENDE WELT =====
  const playedLeague=club.lg;
  const imp=clamp((P.ovr-club.l+4)/8,0.2,1.6)*Math.max(share,0.1);
  const playerBoost=(perf-5.5)*2.4*imp;                 // deine Leistung zieht den Klub hoch/runter
  const worldSim=advanceWorld(P.world, club.n, playerBoost);
  P.world.lastTables=Object.assign({}, worldSim.tables, europeanTables(P.world, club.n, playerBoost));
  P.world.lastYear=P.year; P.world.lastEvents=worldSim.events; P.world.lastPlayoffs=worldSim.playoffs;
  const myTable=worldSim.tables[playedLeague]||[];
  const myRow=myTable.find(r=>r.name===club.n);
  let leaguePos=myRow?myRow.pos:Math.round(clamp(1+(86-club.l)*0.6,1,20));
  const finishLabel=leagueContext(playedLeague,leaguePos,myTable.length);
  const myPO=(worldSim.playoffs||[]).find(p=>p.topClub===club.n||p.secClub===club.n);
  let relPlayoff=null;
  if(myPO){ const iAmTop=myPO.topClub===club.n; relPlayoff={opp:iAmTop?myPO.secClub:myPO.topClub, iAmTop, won:iAmTop?myPO.topStays:!myPO.topStays}; }
  const boostNote = playerBoost>4?"⬆ dein starkes Jahr hat den Klub nach oben getragen":playerBoost<-2.5?"⬇ dein schwaches Jahr hat den Klub gebremst":"";
  if(leaguePos===1 && TOP_LEAGUES.includes(playedLeague)) titlesWon.push(`${P.year} Meister (${club.n})`);

  // NATIONALER POKAL
  const cupWon = R()<(tierOf(club.l)<=2?0.16:0.09);
  const cupIdx = cupWon?5:clamp(Math.round((tierOf(club.l)<=1?3.2:tierOf(club.l)<=2?2.3:1.0)+gauss()*1.2),0,4);
  const cupLabel=compResult(CUP_ROUNDS,cupWon,cupIdx,"cup",club.n,playedLeague);
  if(cupWon) titlesWon.push(`${P.year} Pokalsieger`);

  // EUROPAPOKAL (Champions / Europa / Conference League je nach Stärke)
  let euroName=null, clLabel=null;
  const euro=euroCompetition(club);
  if(euro){
    const euroWon = R()<euro.winCh;
    const euroIdx = euroWon?5:clamp(Math.round(euro.idx+gauss()*1.1),0,4);
    euroName=euro.name;
    clLabel=compResult(CL_ROUNDS,euroWon,euroIdx,"club",club.n);
    if(euroWon) titlesWon.push(`${P.year} ${euro.name}`);
  }

  // NATIONALMANNSCHAFT – Turnierbaum passend zur Konföderation
  const nat=NATIONS.find(n=>n.name===P.nat);
  let calledUp=false, tour=null, intlG=0, intlApps=0, tourWon=false, ntLabel=null, ntBracket=null;
  if(nat && P.ovr>=nat.thr-1){
    calledUp=true; intlApps=poisson(6)+2;
    intlG=poisson(rates.g*st.g*(intlApps)*0.55*ovrF);
    tour = tournamentFor(nat,P.year);
    const strength=clamp((90-nat.thr)/16 + (P.ovr-nat.thr)/20,0.05,0.55);
    const knockout=(t,idx,won)=>{ ntBracket=buildKnockout16(nat,t,idx,won); let lm=null; for(const rd of ntBracket.rounds){for(const m of rd.matches){if(m.aMe||m.bMe)lm={rd:rd.name,m};}} if(won) return "Sieger 🏆"; if(lm){const m=lm.m,opp=m.aMe?m.b:m.a,ps=m.aMe?m.sa:m.sb,os=m.aMe?m.sb:m.sa;return `${lm.rd} – ${ps}:${os} gegen ${opp}`;} return "früh raus"; };
    if(tour==="WM-Qualifikation"){
      const qp=clamp(0.30+(nat.thr-70)/22+(P.ovr-nat.thr)/40,0.25,0.97);
      P.wmQualified=R()<qp;
      ntLabel = P.wmQualified?"✅ für die WM qualifiziert":"❌ WM-Quali gescheitert – WM verpasst";
      ntBracket=null;
    } else if(tour==="Weltmeisterschaft"){
      if(P.wmQualified===false){ ntLabel="❌ nicht qualifiziert – WM verpasst"; ntBracket=null; intlG=0; intlApps=Math.min(intlApps,2); }
      else { tourWon=R()<strength*0.5; const exitIdx=tourWon?4:clamp(Math.round((nat.thr-73)/4+gauss()*1.0),0,3); ntLabel=knockout(tour,exitIdx,tourWon); P.wmQualified=undefined; }
    } else if(tour==="Nations League"){
      tourWon=R()<strength*0.5; const rounds=NL_ROUNDS;
      const ntIdx=tourWon?rounds.length-1:clamp(Math.round((nat.thr-72)/3.4+gauss()*1.0),0,rounds.length-2);
      ntBracket=buildBracket(nat,tour,ntIdx,tourWon,rounds);
      if(tourWon) ntLabel="Sieger 🏆"; else if(ntIdx<=0) ntLabel=rounds[0];
      else { const last=ntBracket.ko[ntBracket.ko.length-1]; ntLabel=last?`${rounds[ntIdx]} – ${last.score} gegen ${last.opp}`:rounds[ntIdx]; }
    } else { // Kontinentalturnier (EM, Copa América, Afrika-Cup, Asien-Cup, Gold Cup)
      tourWon=R()<strength*0.5; const exitIdx=tourWon?4:clamp(Math.round((nat.thr-73)/4+gauss()*1.0),0,3);
      ntLabel=knockout(tour,exitIdx,tourWon);
    }
    if(tourWon) titlesWon.push(`${P.year} ${tour} 🏆`);
  }

  // Klub-Status für nächste Saison übernehmen (Auf-/Abstieg nimmt dich mit)
  const wcNew=P.world.clubs[club.n];
  const oldRank=pyramidRank(playedLeague), newRank=wcNew?pyramidRank(wcNew.league):oldRank;
  const clubPromoted = wcNew && wcNew.league!==playedLeague && newRank<oldRank;
  const clubRelegated = wcNew && wcNew.league!==playedLeague && newRank>oldRank;
  if(wcNew){ P.club.lg=wcNew.league; P.club.l=Math.round(wcNew.level); }
  const worldEvents=worldSim.events.filter(e=>e.name!==club.n).slice(0,4);

  // BALLON D'OR – Rangliste gegen andere Star-Spieler (altern & Rücktritt → Newgens)
  const rivals=(P.world.rivals||[]);
  rivals.forEach(rv=>{
    rv.age=(rv.age||27)+1;
    const a=rv.age; let d;
    if(a<=24) d=0.9; else if(a<=28) d=0.25; else if(a<=31) d=-0.2; else if(a<=33) d=-0.8; else d=-1.6;
    rv.star=clamp(rv.star+d+gauss()*0.4, 76, 96);
  });
  const bdoRetirements=[];
  for(let i=0;i<rivals.length;i++){ if(rivals[i].age >= (rivals[i].retireAge||36)){ bdoRetirements.push(rivals[i].name); rivals[i]=makeNewgen(); } }
  const contribution=goals+assists*0.7+cs*0.5;
  const playerScore=P.ovr*0.95 + (perf-6)*2.2 + titlesWon.length*3.5 + (tourWon?6:0) + intlG*0.4 + Math.min(contribution,48)*0.22;
  const bdoEntries=rivals.map(rv=>({name:rv.name,club:rv.club,isMe:false,score:rv.star*0.92+rint(0,15)+(R()<0.12?5:0)}));
  bdoEntries.push({name:P.name,club:P.club.n,isMe:true,score:playerScore});
  bdoEntries.sort((a,b)=>b.score-a.score);
  bdoEntries.forEach((e,i)=>{ e.rank=i+1; e.score=Math.round(e.score); });
  const bdoRank=(bdoEntries.find(e=>e.isMe)||{}).rank;
  const bdoTotal=bdoEntries.length;
  const ballon=bdoRank===1;
  const bdoRanking=bdoEntries.slice(0,8);
  const topTransfers=simTransfers(rivals); P.world.lastTransfers=topTransfers;
  const sponsorIncome=Math.round((Math.pow(1.09, Math.max(0,P.ovr-68))*0.25 + (P.ballon||0)*0.6)*10)/10;

  const offers=generateOffers(perf,share);
  const gloryVal = meta.gloryKey==="goals"?goals:meta.gloryKey==="assists"?assists:cs;

  return {training,share,apps,minutes,goals,assists,cs,conceded,saves,perf,fam,
    dOVR:Math.round((newOVR-P.ovr)*10)/10,newOVR,titlesWon,injured,injTxt,
    calledUp,tour,intlG,intlApps,tourWon,ballon,offers,club,year:P.year,gloryVal,
    leaguePos,finishLabel,cupLabel,clLabel,euroName,ntLabel,ntBracket,
    playedLeague,leagueTable:myTable,worldEvents,clubPromoted,clubRelegated,boostNote,
    bdoRanking,bdoRank,bdoTotal,bdoRetirements,relPlayoff,seasonEvent,posGames,topTransfers,sponsorIncome};
}

function generateOffers(perf,share){
  const cur=P.club, curT=tierOf(cur.l), offers=[];
  const ALL=Object.values(P.world.clubs).map(c=>({n:c.name,lg:c.league,l:Math.round(c.level)}));
  const expiring=(P.contractYears||0)<=1, hasClause=!!P.releaseClause, benchStuck=share<0.28;
  const forced=!!P.transferRequested; P.transferRequested=false;
  // Interesse anderer Klubs – NICHT jede Saison
  let interest = (perf>=8?0.7 : perf>=7.2?0.46 : perf>=6.4?0.24 : perf>=5.5?0.09 : 0.02) * DIFF().interest;
  if(hasClause && perf>=6.8) interest=Math.max(interest,0.85);
  if(expiring) interest=Math.max(interest,0.55);
  if(benchStuck) interest=Math.max(interest,0.5);
  if((P.morale||65)<40) interest+=0.1;
  if((P.morale||65)<28) interest=Math.max(interest,0.7);   // sehr unzufrieden → Klub stellt dich zur Disposition
  if(forced) interest=1;                                    // Wechsel gefordert → garantiert Angebote
  if(R()>interest) return [];                       // diese Saison kein Angebot
  let pool=[];
  const wantUp = perf>=6.6 && P.ovr>=cur.l-2;
  if(wantUp) pool=ALL.filter(c=>c.n!==cur.n && c.l<=P.ovr+5 && (tierOf(c.l)<curT || c.l>cur.l+1));
  if(benchStuck) pool=pool.concat(ALL.filter(c=>c.n!==cur.n && c.l<=P.ovr-2 && c.l>=P.ovr-10));
  if(!pool.length) pool=ALL.filter(c=>c.n!==cur.n && Math.abs(c.l-P.ovr)<=3);
  const seen=new Set(); pool=pool.filter(c=>!seen.has(c.n)&&seen.add(c.n));
  pool.sort((a,b)=>b.l-a.l);
  let maxOffers = hasClause?3 : (expiring||benchStuck)?2 : 1;   // fester Vertrag ohne Klausel: höchstens 1
  const chosen=[]; const topPool=pool.slice(0,7);
  while(chosen.length<maxOffers && topPool.length){ chosen.push(topPool.splice(Math.floor(R()*topPool.length),1)[0]); }
  chosen.forEach(c=>{ const gap=P.ovr-c.l, s2=clamp(logistic(gap/5.5),0.05,0.95), role=predictRole(s2); offers.push({club:c,role:role.label,roleColor:role.color,share:s2}); });
  return offers.sort((a,b)=>b.club.l-a.club.l);
}

/* ============================ SAISON & ERGEBNIS ============================ */
function runSeason(training){
  const r=simulateSeason(training);
  P.goals+=r.goals; P.assists+=r.assists; P.cs+=r.cs; P.apps+=r.apps; P.caps+=r.intlApps; P.intlGoals+=r.intlG;
  r.titlesWon.forEach(t=>P.titles.push(t));
  if(r.ballon) P.ballon++;
  P.ovr=r.newOVR; if(P.ovr>P.peakOVR)P.peakOVR=P.ovr;
  P.money=(P.money||0)+(P.wage||0)+(r.sponsorIncome||0);
  P.wage=Math.max(P.wage||0, baseWage(P.club.l,P.ovr)*0.9);
  P.contractYears=Math.max(0,(P.contractYears||0)-1);
  { const mo=(P.morale!=null?P.morale:65);
    P.morale=clamp(mo + (r.perf-6)*1.3 + (r.titlesWon.length?3:0) + (r.injured?-6:0) + (r.share<0.3?-5:0) + (r.seasonEvent?r.seasonEvent.mor:0) + (65-mo)*0.12, 0, 100); }
  // Trainergunst – Rolle hoch-/runterarbeiten (schwer)
  { const roleExp = P.role==="star"?7.1 : P.role==="rotation"?6.3 : 5.9;
    let cf=(P.coachFavor!=null?P.coachFavor:50);
    const cfG=(r.perf-roleExp)*3.0;
    cf += (cfG>0?cfG*DIFF().coach:cfG) + (r.titlesWon.length?3:0) + (r.seasonEvent?-9:0) + (r.injured?-3:0) + (r.share<0.22?-4:0) + (50-cf)*0.06;
    P.coachFavor=clamp(cf,0,100);
    const order=["prospect","rotation","star"], idx=order.indexOf(P.role);
    r.roleChange=null;
    if(idx<2 && P.coachFavor>=80){ P.role=order[idx+1]; P.coachFavor=62; r.roleChange={dir:"up",role:P.role}; }
    else if(idx>0 && P.coachFavor<=20){ P.role=order[idx-1]; P.coachFavor=46; r.roleChange={dir:"down",role:P.role}; }
  }
  // Kapitänsbinde – aus Erfahrung, Status & Moral
  r.becameCaptain=false;
  if(!P.captain && P.role==="star" && (P.coachFavor||50)>=72 && P.age>=25 && (P.morale||65)>=55 && (P.seasonNo||1)>=4 && R()<0.55){ P.captain=true; r.becameCaptain=true; }
  else if(P.captain && P.role!=="star"){ P.captain=false; }
  if(P.captain) P.morale=clamp(P.morale+1.5,0,100);
  P.history.push({year:P.year,age:P.age,club:P.club.n,ovr:P.ovr,glory:r.gloryVal,apps:r.apps});
  P.lastResult=r;
  renderResult(r);
}

function renderResult(r){
  const fam=r.fam;
  let statBlocks="";
  if(fam==="score"){
    statBlocks=`<div class="stat"><div class="n">${r.goals}</div><div class="l">Tore</div></div><div class="stat"><div class="n">${r.assists}</div><div class="l">Assists</div></div><div class="stat"><div class="n">${r.apps}</div><div class="l">Einsätze</div></div>`;
  } else if(fam==="create"){
    statBlocks=`<div class="stat"><div class="n">${r.assists}</div><div class="l">Assists</div></div><div class="stat"><div class="n">${r.goals}</div><div class="l">Tore</div></div><div class="stat"><div class="n">${r.apps}</div><div class="l">Einsätze</div></div>`;
  } else if(fam==="def"){
    statBlocks=`<div class="stat"><div class="n">${r.cs}</div><div class="l">Zu-Null</div></div><div class="stat"><div class="n">${r.goals+r.assists}</div><div class="l">Tore+Assists</div></div><div class="stat"><div class="n">${r.apps}</div><div class="l">Einsätze</div></div>`;
  } else {
    const sp=(r.saves+r.conceded)>0?Math.round(r.saves/(r.saves+r.conceded)*100):0;
    statBlocks=`<div class="stat"><div class="n">${r.cs}</div><div class="l">Zu-Null</div></div><div class="stat"><div class="n">${sp}%</div><div class="l">Paradenquote</div></div><div class="stat"><div class="n">${r.conceded}</div><div class="l">Gegentore</div></div>`;
  }

  let notes="";
  if(r.injured) notes+=`<div class="note bad">🩹 ${r.injTxt}</div>`;
  if(r.seasonEvent) notes+=`<div class="note bad">😠 ${r.seasonEvent.t} – zehrt an der Saison (Moral ${r.seasonEvent.mor}).</div>`;
  if(r.relPlayoff){ const p=r.relPlayoff; notes+=`<div class="note ${p.won?'good':'bad'}">🎭 <b>Relegation</b> gegen ${p.opp}: ${p.won?'GEWONNEN':'VERLOREN'} – ${p.iAmTop?(p.won?'Klasse gehalten!':'abgestiegen.'):(p.won?'AUFGESTIEGEN!':'Aufstieg knapp verpasst.')}</div>`; }
  if(r.share<0.3 && !r.injured && !r.seasonEvent) notes+=`<div class="note">🪑 Viel Bank in dieser Saison – deine Entwicklung leidet. Vielleicht ein Wechsel, wo du spielst?</div>`;
  if(r.roleChange) notes+=`<div class="note ${r.roleChange.dir==='up'?'good':'bad'}">${r.roleChange.dir==='up'?'⬆ Du hast den Trainer überzeugt – ab jetzt '+roleLabel(r.roleChange.role)+'!':'⬇ Der Trainer degradiert dich zum '+roleLabel(r.roleChange.role)+'.'}</div>`;
  if(r.becameCaptain) notes+=`<div class="note good">🅒 Du wirst zum <b>Kapitän</b> ernannt – die Kabine folgt dir!</div>`;
  if(r.ballon) notes+=`<div class="note good">🏅 <b>Ballon d'Or!</b> Du bist der beste Spieler der Welt in dieser Saison.</div>`;
  if(r.calledUp) notes+=`<div class="note good">🌍 Nationalelf (${P.nat}) · ${r.tour}: ${r.intlApps} Spiele, ${r.intlG} Tore${r.tourWon?` – <b>TURNIER GEWONNEN!</b> 🏆`:''}</div>`;
  else notes+=`<div class="note">🌍 Keine Nominierung für ${P.nat} (nötig: OVR ${NATIONS.find(n=>n.name===P.nat).thr}). Weiter dran bleiben.</div>`;
  if(r.titlesWon.length) notes+=`<div class="trophies">${r.titlesWon.map(t=>`<span class="trophy">🏆 ${t}</span>`).join("")}</div>`;

  const dov=r.dOVR>=0?`<span style="color:var(--acc)">+${r.dOVR}</span>`:`<span style="color:var(--bad)">${r.dOVR}</span>`;

  app.innerHTML=`
  ${playerBar()}
  <div class="card">
    <h2>Saison ${r.year} · Bilanz bei ${r.club.n}</h2>
    <div class="statgrid">${statBlocks}</div>
    <div class="kv"><span class="k">Saison-Note</span><span class="v">${r.perf.toFixed(1)} / 10</span></div>
    <div class="kv"><span class="k">Spielzeit-Anteil</span><span class="v">${Math.round(r.share*100)}%</span></div>
    <div class="kv"><span class="k">OVR-Entwicklung</span><span class="v">${dov} → ${P.ovr}</span></div>
    ${r.posGames&&r.posGames.length>1?`<div class="kv"><span class="k">Einsätze nach Position</span><span class="v">${r.posGames.filter(p=>p.games>0).map(p=>p.pos+' '+p.games).join(' · ')}</span></div>`:''}
    ${r.sponsorIncome?`<div class="kv"><span class="k">💵 Sponsoren & Werbung</span><span class="v" style="color:var(--acc)">+${fmtMoney(r.sponsorIncome)}</span></div>`:''}
    ${notes}
  </div>
  <div class="card">
    <h2>Abschneiden ${r.year}</h2>
    <div class="kv"><span class="k" style="display:inline-flex;align-items:center;gap:8px">${clubBadge(r.club.n,20)}${r.playedLeague}</span><span class="v">Platz ${r.leaguePos} · ${r.finishLabel}</span></div>
    ${r.boostNote?`<div class="halfopen" style="text-align:left;margin:0 0 6px">${r.boostNote}</div>`:''}
    <div class="kv"><span class="k">Nationaler Pokal</span><span class="v">${r.cupLabel}</span></div>
    ${r.clLabel?`<div class="kv"><span class="k">${r.euroName||'Europapokal'}</span><span class="v">${r.clLabel}</span></div>`:''}
    ${r.ntLabel?`<div class="kv" id="ntrow" style="${r.ntBracket?'cursor:pointer':''}"><span class="k">${r.tour} · ${P.nat} ${r.ntBracket?'<span style="color:var(--acc)">▸ Turnierbaum</span>':''}</span><span class="v">${r.ntLabel}</span></div>`:''}
  </div>
  ${ballonCard(r)}
  ${transfersCard(r)}
  ${leagueTableCard(r)}
  ${worldNewsCard(r)}
  ${renderOffers(r)}
  <button class="ghost" id="opentbl">📋 Alle Tabellen ansehen</button>
  <button class="ghost" id="cont">Ohne Wechsel weiter ➜ nächste Saison</button>`;

  document.getElementById('cont').onclick=nextSeason;
  document.getElementById('opentbl').onclick=()=>openTable(()=>renderResult(P.lastResult));
  if(r.ntBracket){ const nr=document.getElementById('ntrow'); if(nr) nr.onclick=()=>openBracket(r.ntBracket,()=>renderResult(r)); }

// Öffenbare Tabellen-Ansicht mit Liga-Auswahl
let _tableLeague=null, _tableBack=null;
function openTable(back){ _tableBack=back||renderHub; _tableLeague=_tableLeague||P.club.lg; renderTable(); }
function renderTable(){
  const tables=(P.world&&P.world.lastTables)||{};
  let leagues=Object.keys(tables);
  if(!leagues.length) leagues=[...new Set(Object.values(P.world.clubs).map(c=>c.league))];
  const euroOrder=["Champions League","Europa League","Conference League"];
  leagues=euroOrder.filter(l=>leagues.includes(l)).concat(leagues.filter(l=>!euroOrder.includes(l)).sort());
  if(!leagues.includes(_tableLeague)) _tableLeague=leagues.includes(P.club.lg)?P.club.lg:leagues[0];
  let data=tables[_tableLeague];
  if(!data){
    data=Object.values(P.world.clubs).filter(c=>c.league===_tableLeague).sort((a,b)=>b.level-a.level).map((c,i)=>({name:c.name,level:Math.round(c.level),pos:i+1}));
  }
  const opts=leagues.map(l=>`<option ${l===_tableLeague?'selected':''}>${l}</option>`).join("");
  const rows=data.map(t=>{
    const me=t.name===P.club.n;
    return `<tr style="${me?'background:rgba(0,224,122,.12)':''}"><td>${t.pos}</td><td style="text-align:left"><span style="display:inline-flex;align-items:center;gap:8px">${clubBadge(t.name,20)}<span style="${me?'color:var(--acc);font-weight:800':''}">${t.name}${me?' ⚽':''}</span></span></td><td>${t.level}</td></tr>`;
  }).join("");
  const ev=(P.world.lastEvents||[]);
  const evHTML=ev.length
    ? ev.map(e=>`<div class="kv"><span class="k" style="display:inline-flex;align-items:center;gap:8px">${clubBadge(e.name,18)}${e.name}</span><span class="v" style="color:${e.type==='up'?'var(--acc)':'var(--bad)'}">${e.type==='up'?'🔼 Aufstieg':'🔽 Abstieg'} → ${e.league}</span></div>`).join("")
    : `<p class="hint">Noch keine Auf-/Abstiege – spiel eine Saison.</p>`;
  app.innerHTML=`
    ${playerBar()}
    <div class="card">
      <h2>📋 Tabellen${P.world.lastYear?' · Saison '+P.world.lastYear:''}</h2>
      <p class="hint">Alle Ligen laufen unabhängig weiter. Wähle eine Liga:</p>
      <select id="lgsel">${opts}</select>
      <table class="career" style="margin-top:12px"><thead><tr><th>#</th><th style="text-align:left">Verein</th><th>Lvl</th></tr></thead><tbody>${rows}</tbody></table>
    </div>
    <div class="card">
      <h2>🌍 Aus den Ligen · Auf- & Abstiege</h2>
      ${evHTML}
    </div>
    <button class="ghost" id="tback">← Zurück</button>`;
  document.getElementById('lgsel').onchange=e=>{_tableLeague=e.target.value;renderTable();};
  document.getElementById('tback').onclick=()=>{ (_tableBack||renderHub)(); };
}

let _bracketBack=null;
function openBracket(b, back){ _bracketBack=back||(()=>renderResult(P.lastResult)); renderBracketScreen(b); }
function renderKnockout16(b){
  const cell=(name,win,isMe)=>`<span style="${isMe?'color:var(--acc);font-weight:800':win?'font-weight:700':'color:var(--mut);opacity:.75'}">${name}${isMe?' ⚽':''}</span>`;

        <div style="font-size:13.5px">${cell(m.a,winA,m.aMe)} <span style="color:var(--mut)">${m.sa}:${m.sb}</span> ${cell(m.b,!winA,m.bMe)}</div>${starNote}</div>`;

function renderBracketScreen(b){

    <span class="k"><b style="${t.isMe?'color:var(--acc)':''}">${i+1}. ${t.name}${t.isMe?' ⚽':''}</b></span>

/* ============================ VERTRAGSVERHANDLUNG ============================ */
let _negOffer=null, _negResult=null, _negLength=3, _negClause=false, _negBack=null, _afterSign=null;
function openNegotiation(offer, r, opts){ opts=opts||{}; _negOffer=offer; _negResult=r; _negBack=opts.back||(()=>renderResult(_negResult)); _afterSign=opts.after||nextSeason; _negLength=3; _negClause=false; renderNegotiation(); }
function negWage(base){ let w=base*(1+(_negLength-3)*0.03); if(_negClause) w*=0.9; return Math.round(w*10)/10; }
function renderNegotiation(){
  const o=_negOffer; const base=baseWage(o.club.l,P.ovr);
  const leverage=clamp((P.ovr-o.club.l+2)/15,0.05,0.8);   // härter: braucht echten OVR-Vorsprung
  const w=negWage(base);
  const lenChips=[2,3,4,5].map(y=>`<span class="hchip ${_negLength===y?'sel':''}" data-len="${y}">${y} Jahre</span>`).join("");
  app.innerHTML=`
    ${playerBar()}
    <div class="card">
      <h2>💼 Vertragsverhandlung</h2>
      <div style="display:flex;align-items:center;gap:11px;margin:6px 0 10px">${clubBadge(o.club.n,40)}<div><b>${o.club.n}</b> <span class="lvlpill">Level ${o.club.l}</span><br><span class="hint" style="margin:0">${o.club.lg} · Rolle: <span style="color:${o.roleColor}">${o.role}</span></span></div></div>
      <div class="kv"><span class="k">Grundgehalt</span><span class="v">${fmtMoney(w)}/Jahr</span></div>
      <label>Vertragslänge</label>
      <div style="display:flex;gap:6px;flex-wrap:wrap" id="lenopts">${lenChips}</div>
      <label>Ausstiegsklausel</label>
      <div class="opt ${_negClause?'sel':''}" id="clausetoggle" style="min-width:100%">${_negClause?'✓ ':''}Ausstiegsklausel einbauen<small>−10% Gehalt, aber Topklubs können dich jederzeit holen (mehr Angebote)</small></div>
      <p class="hint" style="margin-top:10px">Verhandlungshebel: <b>${Math.round(leverage*100)}%</b> (OVR ${P.ovr} vs. Klub ${o.club.l}). Klubs verhandeln hart – nur wer den Verein wirklich trägt, fordert erfolgreich mehr.</p>
      <div class="opts">
        <div class="opt" data-neg="0" style="min-width:100%">Vertrag annehmen<small>${fmtMoney(w)}/Jahr · sicher</small></div>
        <div class="opt" data-neg="1" style="min-width:100%">Mehr fordern (+20%)<small>${fmtMoney(w*1.2)}/Jahr · Erfolg ~${Math.round((leverage*0.7+0.05)*100)}%</small></div>
        <div class="opt" data-neg="2" style="min-width:100%">Hart pokern (+45%)<small>${fmtMoney(w*1.45)}/Jahr · Erfolg ~${Math.round(leverage*0.45*100)}% – kann platzen</small></div>
      </div>
    </div>
    <button class="ghost" id="negback">← Zurück</button>`;
  document.getElementById('lenopts').onclick=e=>{const b=e.target.closest('[data-len]');if(!b)return;_negLength=+b.dataset.len;renderNegotiation();};
  document.getElementById('clausetoggle').onclick=()=>{_negClause=!_negClause;renderNegotiation();};
  document.querySelectorAll('[data-neg]').forEach(b=>b.onclick=()=>negotiate(+b.dataset.neg, w, leverage));
  document.getElementById('negback').onclick=()=>_negBack();
}
function negotiate(choice, w, leverage){
  const o=_negOffer; let wage=w, msg="Vertrag zu den ausgehandelten Konditionen unterschrieben.";
  if(choice===1){
    if(R()<leverage*0.7+0.05){ wage=Math.round(w*1.2*10)/10; msg="Der Klub gibt etwas nach – mehr Gehalt! 💰"; }
    else { wage=w; msg="Der Klub bleibt hart beim Grundgehalt."; }
  } else if(choice===2){
    const p=leverage*0.45, roll=R();
    if(roll<p){ wage=Math.round(w*1.45*10)/10; msg="Pokerface! Ein Topgehalt erkämpft! 💰💰"; }
    else if(roll<p+0.3){ wage=w; msg="Der Klub lässt sich nicht erpressen – Grundgehalt."; }
    else { P.morale=clamp((P.morale||65)-5,0,100); renderNegBust(); return; }
  }
  signClub(o, Math.round(wage*10)/10, msg);
}
function renderNegBust(){
  app.innerHTML=`${playerBar()}<div class="card"><h2>💥 Verhandlung geplatzt</h2><div class="note bad">${_negOffer.club.n} zieht das Angebot zurück – zu gierig gepokert. (Moral −5)</div></div><button class="ghost" id="nb">← Zurück</button>`;
  document.getElementById('nb').onclick=()=>_negBack();
}
function signClub(o, wage, msg){
  const sameClub = P.club && P.club.n===o.club.n;
  P.club={n:o.club.n,lg:o.club.lg,l:o.club.l}; P.clubs.add(o.club.n);
  if(!sameClub) P.role = o.share>=0.7?"star" : o.share>=0.45?"rotation":"prospect";
  P.wage=wage; P.contractYears=_negLength; P.releaseClause=_negClause;
  app.innerHTML=`${playerBar()}
    <div class="card"><h2>✍️ Unterschrieben bei ${o.club.n}</h2>
      <div class="note good">${msg}</div>
      <div class="kv"><span class="k">Gehalt</span><span class="v">${fmtMoney(wage)}/Jahr</span></div>
      <div class="kv"><span class="k">Laufzeit</span><span class="v">${_negLength} Jahre${_negClause?' · mit Ausstiegsklausel':''}</span></div>
      <div class="kv"><span class="k">Rolle</span><span class="v">${sameClub?roleLabel(P.role):o.role}</span></div>
    </div>
    <button class="primary" id="sok">Weiter ➜</button>`;
  document.getElementById('sok').onclick=()=>_afterSign();
}
// Vertrag ausgelaufen: verlängern oder ablösefrei
function renderContractExpiry(){
  const cur=P.club;
  app.innerHTML=`${playerBar()}
    <div class="card"><h2>📄 Vertrag ausgelaufen</h2>
      <p class="hint">Dein Vertrag bei ${cur.n} ist abgelaufen. Verlängern – oder ablösefrei einen neuen Klub suchen?</p>
      <div class="opts">
        <div class="opt" id="renew" style="min-width:100%">Bei ${cur.n} verlängern<small>neuen Vertrag aushandeln</small></div>

      </div>
    </div>`;
  document.getElementById('renew').onclick=()=>openNegotiation({club:{n:cur.n,lg:cur.lg,l:cur.l}, role:roleLabel(P.role), roleColor:'var(--acc)', share:baseShare()}, null, {back:renderContractExpiry, after:renderHub});
  document.getElementById('freeagent').onclick=()=>{ P.transferRequested=true; renderFreeAgent(generateOffers(6.8, baseShare())); };
}
function renderFreeAgent(offers){
  const cur=P.club;
  if(!offers.length){
    app.innerHTML=`${playerBar()}<div class="card"><h2>🆓 Ablösefrei</h2><div class="note bad">Aktuell will dich kein anderer Klub – du verlängerst notgedrungen.</div></div><button class="primary" id="fx">Verlängern</button>`;
    document.getElementById('fx').onclick=()=>openNegotiation({club:{n:cur.n,lg:cur.lg,l:cur.l},role:roleLabel(P.role),roleColor:'var(--acc)',share:baseShare()}, null, {back:renderContractExpiry, after:renderHub});
    return;
  }
  const rows=offers.map((o,i)=>`<div class="offer"><div style="flex:none">${clubBadge(o.club.n,34)}</div><div class="info"><b>${o.club.n}</b> <span class="lvlpill">Level ${o.club.l}</span><small>${o.club.lg} · Rolle: <span style="color:${o.roleColor}">${o.role}</span> · ablösefrei</small></div><button data-fa="${i}">Verhandeln</button></div>`).join("");
  app.innerHTML=`${playerBar()}<div class="card"><h2>🆓 Ablösefreie Angebote</h2><p class="hint">Ohne Ablöse – aber das Gehalt musst du noch aushandeln.</p>${rows}</div><button class="ghost" id="faback">← Zurück</button>`;
  document.querySelectorAll('[data-fa]').forEach(b=>b.onclick=()=>openNegotiation(offers[+b.dataset.fa], null, {back:()=>renderFreeAgent(offers), after:renderHub}));
  document.getElementById('faback').onclick=renderContractExpiry;
}

  {q:"Du hattest eine Traumsaison. Wie fühlst du dich?",
   o:[{a:"Dankbar – ohne das Team ginge das nicht.",m:7,note:"Bescheidenheit kommt an."},
      {a:"Ich bin einfach der Beste.",m:-4,note:"Arrogant, finden viele."},
      {a:"Da geht noch mehr.",m:4,note:"Hungrig – die Fans lieben es."},
      {a:"War auch etwas Glück dabei.",m:2,note:"Sympathisch-bescheiden."}]},
  {q:"Ein Kind fragt vor dem Spiel nach einem Autogramm.",
   o:[{a:"Klar – immer Zeit für die Fans.",m:7,note:"Herzen gewonnen."},
      {a:"Nach dem Spiel, versprochen.",m:2,note:"Verständnisvoll."},
      {a:"Jetzt nicht, ich bin fokussiert.",m:-2,note:"Wirkt etwas kühl."},
      {a:"Vorbeigehen.",m:-6,note:"Enttäuschte Fans."}]}
];
function renderInterview(){
  const iv=pick(INTERVIEWS);
  app.innerHTML=`
    ${playerBar()}
    <div class="card">
      <h2>🎤 Presse-Interview · ${P.year}</h2>
      <p style="font-size:15px;font-weight:600;margin:6px 0 12px">„${iv.q}"</p>
      <div class="opts" id="ivopts">${iv.o.map((op,i)=>`<div class="opt" data-iv="${i}" style="min-width:100%;text-align:left">${op.a}</div>`).join("")}</div>
      <p class="halfopen" style="text-align:left;margin-top:10px">Deine Antwort verändert deine Moral – und Moral wirkt sich auf deine Leistung aus.</p>
    </div>`;
  document.getElementById('ivopts').onclick=e=>{ const b=e.target.closest('[data-iv]'); if(!b) return; answerInterview(iv.o[+b.dataset.iv]); };
}
function answerInterview(op){
  P.morale=clamp((P.morale!=null?P.morale:65)+op.m,0,100);
  const sign=op.m>0?`+${op.m}`:`${op.m}`;
  app.innerHTML=`
    ${playerBar()}
    <div class="card">
      <h2>🎤 Reaktion</h2>
      <div class="note ${op.m>=3?'good':op.m<=-3?'bad':''}">${op.note}</div>
      <div class="kv"><span class="k">Moral</span><span class="v">${sign} → ${Math.round(P.morale)}/100</span></div>
    </div>
    <button class="primary" id="ivok">Weiter ➜ Saison</button>`;
  document.getElementById('ivok').onclick=renderHub;
}

function nextSeason(){
  P.age++; P.year++; P.seasonNo=(P.seasonNo||1)+1;
  if(P.age>P.retireAge || (P.ovr<60 && P.age>33)){ renderLegacy(); return; }
  if((P.contractYears||0)<=0){ renderContractExpiry(); return; }
  if(P.seasonNo%3===0){ renderInterview(); return; }
  renderHub();
}

/* ============================ LEGACY ============================ */
function renderLegacy(){
  clearSave();
  const gp=posOf(P.pos), fam=gp.fam, isAtt=(fam==="score"||fam==="create");
  const gloryTotal = gp.gloryKey==="goals"?P.goals:gp.gloryKey==="assists"?P.assists:P.cs;
  const gloryLabel = gp.gloryKey==="cs"?"Zu-Null":gp.gloryKey==="assists"?"Assists":"Tore";
  const prod = fam==="score"?P.goals*0.35 : fam==="create"?(P.assists*0.3+P.goals*0.2) : P.cs*0.45;
  const score = P.titles.length*3 + P.ballon*16 + P.intlGoals*0.4 + P.caps*0.12 + prod + P.peakOVR*0.6;
  let verdict,vsub;
  if(score>=140){verdict="⚽ G.O.A.T.";vsub="Einer der Größten aller Zeiten.";}
  else if(score>=105){verdict="🌟 Weltstar-Legende";vsub="Dein Name gehört in die Geschichtsbücher.";}
  else if(score>=75){verdict="🏆 Vereinslegende";vsub="Ein Star, an den man sich lange erinnert.";}
  else if(score>=48){verdict="💪 Solider Profi";vsub="Eine respektable Karriere auf hohem Niveau.";}
  else {verdict="👟 Ehrlicher Kämpfer";vsub="Vom Underdog nie ganz nach oben – aber ein echter Profi.";}

  const clubList=[...P.clubs].join(" · ");
  const trophyChips=P.titles.length?P.titles.map(t=>`<span class="trophy">🏆 ${t}</span>`).join(""):'<span class="hint">Keine großen Titel – aber eine gespielte Karriere.</span>';
  const hist=P.history.map(h=>`<tr><td>${h.year}</td><td>${h.club}</td><td>${h.age}</td><td>${h.ovr}</td><td>${h.glory}</td><td>${h.apps}</td></tr>`).join("");
  const sec = isAtt
    ? `<div class="stat"><div class="n">${P.goals}</div><div class="l">Tore</div></div><div class="stat"><div class="n">${P.assists}</div><div class="l">Assists</div></div>`
    : `<div class="stat"><div class="n">${P.cs}</div><div class="l">Zu-Null</div></div><div class="stat"><div class="n">${P.goals+P.assists}</div><div class="l">Scorer</div></div>`;

  app.innerHTML=`
  <div class="card">
    <div class="verdict">
      <div style="width:76px;height:76px;margin:0 auto 6px;border-radius:50%;overflow:hidden">${avatarComposite(P.av,76)}</div>
      <div class="big">${verdict}</div>
      <div class="sm">${P.name} · ${P.pos} ${gp.label} · ${P.nat}</div>
      <div class="sm">Karriere beendet mit ${P.age} · Peak-OVR ${P.peakOVR}</div>
    </div>
    <div class="statgrid" style="margin-top:14px">
      <div class="stat"><div class="n">${gloryTotal}</div><div class="l">${gloryLabel} (Karriere)</div></div>
      <div class="stat"><div class="n">${P.titles.length}</div><div class="l">Titel</div></div>
      <div class="stat"><div class="n">${P.ballon}</div><div class="l">Ballon d'Or</div></div>
    </div>
    <div class="statgrid">
      ${sec}
      <div class="stat"><div class="n">${P.caps}</div><div class="l">Länderspiele (${P.intlGoals}⚽)</div></div>
    </div>
    <p class="hint" style="margin-top:14px"><b>Vereine:</b> ${clubList}</p>
    <p class="hint" style="margin-top:6px"><b>💰 Karriere-Verdienst:</b> ${fmtMoney(P.money)}</p>
    <div class="trophies">${trophyChips}</div>
  </div>
  <div class="card">
    <h2>Karriereverlauf</h2>
    <table class="career">
      <thead><tr><th>Jahr</th><th>Verein</th><th>Alter</th><th>OVR</th><th>${gloryLabel}</th><th>Sp.</th></tr></thead>
      <tbody>${hist}</tbody>
    </table>
  </div>
  <button class="primary" id="again">Neue Karriere starten ⚽</button>`;
  document.getElementById('again').onclick=()=>{draft={name:"",age:17,nat:NATIONS[5].name,pos:"ST",style:0,av:Object.assign({},DEFAULT_AV),mode:0,goldenOptions:null,startClubName:null,jerseyName:"",number:0,foot:"Rechts",pos2:""};renderCreation();};
}

</script>

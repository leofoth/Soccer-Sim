<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#071b16"><title>Football Career – Matchday</title>
<style>
:root{color-scheme:dark;--bg:#071b16;--panel:#102a22;--green:#5cf2a2;--muted:#9cb7ac}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,sans-serif;color:#f2fff8;touch-action:none}.game{height:100dvh;display:flex;flex-direction:column;padding:10px;gap:8px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.score{font-weight:900;font-size:clamp(16px,3vw,25px)}.muted{color:var(--muted);font-size:12px}.top button,.action{border:1px solid #315447;background:#15382c;color:#fff;border-radius:12px;padding:10px 14px;font-weight:800}.pitch-wrap{position:relative;flex:1;min-height:0;border:2px solid #6ccf91;border-radius:12px;overflow:hidden;background:#14663f}.pitch{display:block;width:100%;height:100%}.hud{position:absolute;left:50%;top:10px;transform:translateX(-50%);padding:6px 12px;background:#061a13dd;border-radius:10px;font-size:12px;white-space:nowrap}.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:90px}.pad{width:124px;height:82px;position:relative;flex:none;border-radius:18px;background:#ffffff12;border:1px solid #ffffff40}.pad button{position:absolute;width:38px;height:34px;border:0;border-radius:10px;background:#d7f8e8;color:#102a22;font-weight:900;font-size:20px;touch-action:none}.up{top:3px;left:43px}.down{bottom:3px;left:43px}.left{top:24px;left:3px}.right{top:24px;right:3px}.actions{display:flex;gap:8px}.action{min-width:76px;min-height:66px;font-size:13px;touch-action:none}.action strong{display:block;font-size:22px}.shoot{background:#5cf2a2;color:#062015;border-color:#5cf2a2}.hint{font-size:11px;color:var(--mut);text-align:center}@media(min-width:800px){.game{max-width:1200px;margin:auto}.pad{width:150px;height:90px}.pad button{width:42px;height:36px}.up,.down{left:54px}.left{top:27px}.right{top:27px}.action{min-width:100px}}
</style></head><body><main class="game"><header class="top"><div><div class="score">⚽ MATCHDAY <span class="muted">· Karriere-Prototyp</span></div><div class="muted">Grünfeld FC · Testspiel</div></div><div class="score" id="score">0 : 0</div><button id="exit">Menü</button></header><section class="pitch-wrap"><canvas id="pitch" class="pitch" aria-label="Fußballfeld"></canvas><div class="hud" id="hud">Bewege dich mit dem Steuerkreuz · Schuss aufs Tor!</div></section><section class="controls"><div class="pad" aria-label="Bewegungssteuerung"><button class="up" data-dir="up">↑</button><button class="down" data-dir="down">↓</button><button class="left" data-dir="left">←</button><button class="right" data-dir="right">→</button></div><div class="hint">Links / rechts bewegen · Schuss aufs gegnerische Tor</div><div class="actions"><button class="action" id="pass"><strong>↗</strong>PASS</button><button class="action shoot" id="shoot"><strong>⚽</strong>SCHUSS</button></div></section></main>
<script type="module">
import {saveCareer,loadCareer,simulateMatch} from './game-core.js';
const canvas=document.querySelector('#pitch'),ctx=canvas.getContext('2d'),hud=document.querySelector('#hud'),scoreEl=document.querySelector('#score');
const state={x:.23,y:.5,bx:.28,by:.5,vx:0,vy:0,oppX:.73,oppY:.5,goals:0,against:0,time:90,ended:false,last:performance.now(),keys:new Set(),shot:0};
function resize(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
function draw(){const w=canvas.clientWidth,h=canvas.clientHeight;ctx.clearRect(0,0,w,h);ctx.fillStyle='#197447';ctx.fillRect(0,0,w,h);for(let i=0;i<8;i++){ctx.fillStyle=i%2?'#ffffff08':'#001d1010';ctx.fillRect(i*w/8,0,w/8,h)}ctx.strokeStyle='#d7ffe1cc';ctx.lineWidth=2;ctx.strokeRect(12,12,w-24,h-24);ctx.beginPath();ctx.moveTo(w/2,12);ctx.lineTo(w/2,h-12);ctx.stroke();ctx.beginPath();ctx.arc(w/2,h/2,Math.min(h*.16,70),0,Math.PI*2);ctx.stroke();ctx.strokeRect(12,h*.28,w*.13,h*.44);ctx.strokeRect(w-12-w*.13,h*.28,w*.13,h*.44);ctx.fillStyle='#eafff0';ctx.fillRect(w-8,h*.4,8,h*.2);ctx.fillStyle='#f8d878';ctx.beginPath();ctx.arc(state.bx*w,state.by*h,7,0,Math.PI*2);ctx.fill();ctx.fillStyle='#5cf2a2';ctx.beginPath();ctx.arc(state.x*w,state.y*h,13,0,Math.PI*2);ctx.fill();ctx.fillStyle='#eafaf1';ctx.fillRect(state.x*w-8,state.y*h-2,16,4);ctx.fillStyle='#ff8d8d';ctx.beginPath();ctx.arc(state.oppX*w,state.oppY*h,12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 12px system-ui';ctx.fillText('DU',state.x*w-9,state.y*h-19);ctx.fillText('KI',state.oppX*w-6,state.oppY*h-18)}
function tick(now){const dt=Math.min((now-state.last)/1000,.05);state.last=now;if(!state.ended){state.time-=dt;if(state.time<=0){state.time=0;state.ended=true;finish()}let dx=0,dy=0;if(state.keys.has('left'))dx--;if(state.keys.has('right'))dx++;if(state.keys.has('up'))dy--;if(state.keys.has('down'))dy++;const len=Math.hypot(dx,dy)||1;state.x=Math.max(.04,Math.min(.94,state.x+dx/len*.42*dt));state.y=Math.max(.06,Math.min(.94,state.y+dy/len*.42*dt));const dist=Math.hypot(state.x-state.bx,state.y-state.by);if(dist<.065){state.bx=state.x+.025;state.by=state.y;state.vx=0;state.vy=0}else{state.bx+=state.vx*dt;state.by+=state.vy*dt;state.vx*=.985;state.vy*=.985}state.oppY+=Math.sign(state.by-state.oppY)*.12*dt;state.oppX=.73+Math.sin(now/700)*.025;if(state.bx>.965&&Math.abs(state.by-.5)<.13){state.goals++;state.bx=.28;state.by=.5;state.x=.23;hud.textContent='TOR! Stark abgeschlossen. Weiter geht’s!';updateScore()}if(state.bx<.02){state.against++;state.bx=.28;state.by=.5;updateScore()}state.by=Math.max(.03,Math.min(.97,state.by));}draw();ctx.fillStyle='#fff';ctx.font='bold 14px system-ui';ctx.fillText(''+Math.ceil(state.time)+'s',canvas.clientWidth/2-10,canvas.clientHeight-20);requestAnimationFrame(tick)}
function updateScore(){scoreEl.textContent=state.goals+' : '+state.against}
function kick(power,accuracy){const d=Math.hypot(state.x-state.bx,state.y-state.by);if(d>.12){hud.textContent='Du musst näher am Ball sein!';return}state.vx=power;state.vy=(.5-state.y)*accuracy+(Math.random()-.5)*.15;state.bx=state.x+.035;state.by=state.y;hud.textContent=power>.8?'Schuss aufs Tor!':'Pass gespielt.'}
function finish(){hud.textContent='Abpfiff! Endstand '+state.goals+':'+state.against+'. Ergebnis wird gespeichert.';const career=loadCareer(localStorage)||{matches:0,goals:0,conceded:0,xp:0};career.matches++;career.goals+=state.goals;career.conceded+=state.against;career.xp=(career.xp||0)+10+state.goals*5;career.lastMatch={goalsFor:state.goals,goalsAgainst:state.against,date:new Date().toISOString()};saveCareer(localStorage,career);document.querySelector('#shoot').textContent='ERGEBNIS';document.querySelector('#shoot').onclick=()=>location.href='./index.html';}
document.querySelectorAll('[data-dir]').forEach(b=>{const dir=b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();state.keys.add(dir);b.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>state.keys.delete(dir)))});
document.querySelector('#shoot').addEventListener('click',()=>{if(state.ended){location.href='./index.html';return}kick(1.05,.2)});document.querySelector('#pass').addEventListener('click',()=>{if(!state.ended)kick(.55,.08)});document.querySelector('#exit').addEventListener('click',()=>location.href='./index.html');
requestAnimationFrame(tick);
</script></body></html>
